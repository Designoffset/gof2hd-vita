<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Galaxy on Fire 2 HD — Vita Digital Manual</title><link rel="stylesheet" href="style.css"></head><body><main class="manual" id="manual"><div class="accent"></div><header class="top"><span class="brand">GALAXY ON FIRE 2 HD</span><span>PS VITA // PILOT'S MANUAL</span></header><div class="line"></div><article class="body"><div class="eyebrow" id="k"></div><h1 class="heading" id="h"></h1><div class="copy" id="t"></div><div class="gallery" id="gallery" aria-label="Illustrated ship and character concepts"></div></article><footer class="bottom"><span class="index" id="num"></span><div class="controls"><button id="prev" aria-label="Previous page">◀ PREV</button><button id="next" aria-label="Next page">NEXT ▶</button></div></footer></main><script>const pages=[{"kicker": "WELCOME ABOARD", "title": "PILOT BRIEFING", "text": "The galaxy is open. Your ship is your livelihood, your reputation travels ahead of you, and every jump can lead to profit or danger. This field manual introduces the universe of Galaxy on Fire 2 HD without revealing the sequel’s central storyline."}, {"kicker": "THE STORY SO FAR", "title": "PROLOGUE · GALAXY ON FIRE 1", "text": "Before the events of Galaxy on Fire 2, Terran pilot Keith T. Maxwell left military service and became an independent mercenary. Guided initially by Lieutenant Christine Hammond, he took contracts, escorted shipments and crossed contested systems as the Terran Federation and Vossk Empire struggled for influence."}, {"kicker": "THE STORY SO FAR", "title": "THE PIRATE CONSPIRACY", "text": "Maxwell’s routine contracts drew him into a conspiracy connecting pirate attacks, hostile Vossk interests and the corrupt Terran officer Vlad Borsikov. Christine Hammond was killed in the conflict. Maxwell ultimately defeated Borsikov, bringing the conspiracy to an end—but not erasing the political rivalries that had helped it grow."}, {"kicker": "GALACTIC ATLAS", "title": "A FRACTURED FRONTIER", "text": "The known galaxy is divided among four major political powers. Jumpgates connect markets and military borders; trade routes attract freighters, mercenaries and raiders. Governments are not interchangeable: a pilot welcomed in one region may be regarded with suspicion in another."}, {"kicker": "FACTION DOSSIER 01", "title": "TERRAN FEDERATION", "text": "Species: Human (Terran). A far-reaching political and commercial power with a culture of exploration, enterprise and independent-minded citizens. Terran space is a crossroads for interstellar trade. Longstanding tensions with the Vossk Empire remain part of the political landscape."}, {"kicker": "FACTION DOSSIER 02", "title": "VOSSK EMPIRE", "text": "Species: Vossk. A disciplined, militarized civilization with strong imperial traditions and an emphasis on duty and martial strength. Vossk ships are typically sturdy and visually distinctive. Relations with the Terran Federation are historically strained, so borders deserve careful navigation."}, {"kicker": "FACTION DOSSIER 03", "title": "NIVELIAN REPUBLIC", "text": "Species: Nivelian. A technologically sophisticated reptilian people whose Republic has experienced serious internal political division. Nivelian craft and stations are known for elegant, advanced designs. The Republic’s dispute with the breakaway Mido Confederation is a defining regional conflict."}, {"kicker": "FACTION DOSSIER 04", "title": "MIDO CONFEDERATION", "text": "Population: Primarily Nivelian and Terran communities. The Confederation arose from separatists and dissidents during the Nivelian Civil War. Its independence is contested by the Nivelian Republic. Mido’s frontier identity and practical, often repurposed ships reflect a younger state shaped by hardship."}, {"kicker": "SPECIES FILE", "title": "TERRANS · VOSSK · NIVELIANS", "text": "Terrans are adaptable humans with an appetite for commerce and exploration. Vossk are a distinct, formidable alien civilization whose social institutions place high value on military service. Nivelians are reptilian and technically accomplished, but are not politically united: many live beyond the Republic’s borders."}, {"kicker": "SPECIES FILE", "title": "OTHER INHABITANTS", "text": "Beyond the three best-known species, station lounges and trading hubs host less prominent groups such as Bobolians, Octopods and cyborgs. They contribute to the galaxy’s mix of merchants, travelers and specialists. Not every individual speaks for a government, and appearances are not a reliable guide to allegiance."}, {"kicker": "FRONTIER INTELLIGENCE", "title": "PIRATES & UNCHARTED RISKS", "text": "Pirates are opportunistic raiders, not a single recognized interstellar government. Their attacks make some routes more dangerous than others. You may also hear unsettling rumors in station lounges; treat unfamiliar threats as unverified intelligence rather than assuming every story is true."}, {"kicker": "PILOT OPERATIONS", "title": "A LIFE BETWEEN STATIONS", "text": "Trade commodities, accept contracts, mine asteroids, upgrade your vessel and explore jumpgate-linked systems. Ship choice is a balance of firepower, protection, handling and cargo capacity. Read local conditions before departing and keep enough resources for the journey home."}, {"kicker": "SHIP SYSTEMS", "title": "FIELD CHECKLIST", "text": "Before launch: inspect hull and equipment, review installed weapons and utilities, check cargo space, and confirm your next destination. In flight: use the radar and target indicators, watch incoming fire, and be ready to disengage. At a station: repair, refit, trade and look for work."}, {"kicker": "PILOT CONTROLS", "title": "FLIGHT CONTROLS", "text": "Left stick — steer\nRight stick ↑ / ↓ — speed up / slow down\nRight stick ← / → — roll\nL / R — barrel roll\n✕ fire  ·  □ secondary weapon  ·  △ boost  ·  ○ change camera\nD-pad ↑ autopilot  ·  ↓ fast forward / jump drive  ·  → action menu\nSTART — pause\nMenus & dialogue: left stick or D-pad moves the cursor, ✕ or R selects, ○ goes back. Touch works everywhere."}, {"kicker": "TECHNICAL RECORD", "title": "PS VITA HOMEBREW EDITION", "text": "Package: Galaxy on Fire 2 HD · Title ID: GOF2HD012. An unofficial fan port that runs the Android release on PS Vita. The game renders at 1280 × 725 and is scaled to the Vita screen at 60 fps, with full music and voice acting, add-ons unlocked and native button controls. Requires your own copy of the game data."}, {"kicker": "ABOUT THIS EDITION", "title": "A SPOILER-SAFE FIELD GUIDE", "text": "This fan-made digital manual recounts the first game’s story but intentionally avoids Galaxy on Fire 2 campaign reveals. Faction descriptions reflect introductory setting information; no mission walkthroughs, hidden identities, or late-game twists are included. Created as a companion to your PS Vita homebrew installation."}];const galleryMap={0:'cover',1:'prologue',2:'prologue',4:'terran',5:'vossk',6:'nivelian',7:'mido',8:'terran',9:'nivelian',11:'cover',12:'prologue',14:'cover'};let i=0;function render(){const g=document.getElementById('gallery');const key=galleryMap[i];g.innerHTML=key?'<img src="assets/'+key+'_gallery.jpg" alt="Illustrative portraits and spacecraft concepts"><span>ILLUSTRATIVE CONCEPT ART · NOT VERIFIED IN-GAME MODELS</span>':'';g.style.display=key?'block':'none';document.getElementById('k').textContent=pages[i].kicker;document.getElementById('h').textContent=pages[i].title;document.getElementById('t').textContent=pages[i].text;document.getElementById('num').textContent=String(i+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1;location.hash='page-'+(i+1)}function move(n){i=Math.max(0,Math.min(pages.length-1,i+n));render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')move(1);if(e.key==='ArrowLeft')move(-1)});let x=0;document.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)move(d<0?1:-1)},{passive:true});render();</script></body></html>
